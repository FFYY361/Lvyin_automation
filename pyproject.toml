[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thufootball_automation"
version = "1.0.0"
description = "Composable automation services for THUFootball workflows"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]
website = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23,<26",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.18,<1",
  "SQLAlchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
thufootball = "thufootball.cli:main"
preview = "preview.cli:main"
wechat-official = "wechat_official.cli:main"
weather = "weather.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thufootball = ["assets/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"test/**/test_*.py" = ["E402"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra"
testpaths = ["test"]
