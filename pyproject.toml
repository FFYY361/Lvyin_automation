[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thufootball_automation"
version = "0.1.0"
description = "Composable automation services for THUFootball workflows"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "lxml>=5,<7",
]

[project.scripts]
thufootball = "thufootball.cli:main"
preview = "preview.cli:main"
wechat-official = "wechat_official.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
